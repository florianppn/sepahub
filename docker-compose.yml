services:
  db:
    image: mariadb:11
    container_name: sepa26-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root_password}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-sepa26_db}
      MARIADB_USER: ${MARIADB_USER:-sepa_user}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-sepa_password}
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - sepa-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sepa26-backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mariadb://db:3306/${MARIADB_DATABASE:-sepa26_db}
      DB_USER: ${MARIADB_USER:-sepa_user}
      DB_PASSWORD: ${MARIADB_PASSWORD:-sepa_password}
    ports:
      - "8100:8100"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sepa-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sepa26-frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - backend
    networks:
      - sepa-network

volumes:
  mariadb_data:

networks:
  sepa-network:
    driver: bridge
